name: HouseholdApp
options:
  bundleIdPrefix: com.nakazaki.householdapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  HouseholdApp:
    type: application
    platform: iOS
    sources:
      - path: HouseholdApp
    info:
      path: HouseholdApp/Info.plist
      properties:
        CFBundleDisplayName: 家計簿
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nakazaki.householdapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
  HouseholdAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HouseholdAppTests
    dependencies:
      - target: HouseholdApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nakazaki.householdapp.tests
schemes:
  HouseholdApp:
    build:
      targets:
        HouseholdApp: all
        HouseholdAppTests: [test]
    test:
      targets:
        - HouseholdAppTests
    run:
      config: Debug
